[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impossible-quest"
version = "0.1.0"
description = "Telegram-бот с текстовым квестом для ТРКПО"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "pydantic>=2.9,<3",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["quest_bot*"]
namespaces = false

[tool.setuptools.package-data]
quest_bot = ["quest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
